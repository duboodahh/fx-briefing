name: Overnight Market Briefing

on:
  schedule:
    # 평일 아침 KST ~07:00 (= 일~목 21:50 UTC). 미국 장 마감은 05시(서머타임 종료 후 06시) KST라 데이터는 확정된 뒤다.
    # 기존 'Daily Macro Issue Briefing'(22:07 UTC)보다 먼저 도착하도록 약간 앞에 잡았다. GitHub 예약 실행은 수 분~수십 분 늦을 수 있다.
    # 한국·미국 모두 새 거래일이 없는 날은 코드가 알아서 건너뛴다.
    - cron: "50 21 * * 0-4"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 (첫 테스트용)

concurrency:
  group: overnight-briefing
  cancel-in-progress: false

jobs:
  overnight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect, write briefing (Korean + English), send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.overnight.main --send

      # 그날 수집한 수치·뉴스 후보(원문 링크 포함)·생성 결과를 30일간 보관한다. 실패한 날에도 남기고, 파일이 없으면 조용히 넘어간다.
      - name: Keep the day's data for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-data-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.notify || true
