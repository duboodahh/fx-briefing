# 오버나잇 브리핑 뉴스 소스. tier: 1=원 출처(중앙은행·규제기관), 2=주요 언론, 3=전문 사이트(보조용)
# domains: 이 피드의 기사가 연결되어야 하는 발행처 도메인. 링크가 다른 곳(구글뉴스 등)이면 '원문 없음'으로 보고 후보에서 뺀다.
# topic: equity | ficc | both (이 피드가 주로 다루는 분야 힌트)
max_per_source: 6
max_total: 80
window_margin_hours: 2   # 직전 미국 장 마감 시점부터 지금까지 + 여유

feeds:
  # --- 1등급: 원 출처 ---
