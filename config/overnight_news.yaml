  - {name: "Fed Speeches", tier: 1, topic: ficc, lang: en, domains: [federalreserve.gov], url: "https://www.federalreserve.gov/feeds/speeches.xml"}
  - {name: "ECB Press",    tier: 1, topic: ficc, lang: en, domains: [ecb.europa.eu],       url: "https://www.ecb.europa.eu/rss/press.html"}
  # --- 2등급: 주요 언론 (영문) ---
