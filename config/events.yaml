# 이벤트 캘린더 (수동 관리). 무료로 안정적인 일정 API가 없어 공식 발표 일정을 직접 옮겨 적는다.
# 확인일: 2026-10-05. 일정이 바뀔 수 있으니 분기마다 공식 출처로 다시 확인할 것.
#
# date  : 현지 기준 날짜 (YYYY-MM-DD)
# time  : 현지 시각 (HH:MM). 없으면 종일 일정으로 취급
# tz    : time의 시간대 (America/New_York | Asia/Seoul). time이 있을 때만 사용
# impact: high | medium  (브리핑에서 어떤 일정을 먼저 보여줄지 판단용)
#
# 미포함: PMI(ISM) 등 — 공식 발표 일정을 아직 확인하지 못해 넣지 않음.

events:
